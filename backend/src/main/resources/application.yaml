spring:
  application:
    name: backend
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/snapvault}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:admin}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true    